name: BONO OS WebView2 Desktop Preview

on:
  push:
    branches: [feature/desktop-webview2, integration/webview2-uyap-single-case]
    paths:
      - 'desktop/BonoWebDesktop/**'
      - 'desktop/BonoWebDesktop.Smoke/**'
      - 'web/**'
      - 'scripts/test_web_desktop_case_ui.js'
      - 'scripts/test_web_desktop_hearings.js'
      - 'scripts/test_webview2_uyap_single_case_e2e.js'
      - 'bridge/server.js'
      - 'bridge/uyap.js'
      - 'bridge/db.js'
      - 'scripts/web_desktop_updater.ps1'
      - 'scripts/test_web_desktop_updater.ps1'
      - 'docs/web-desktop-update.md'
      - '.github/workflows/web-desktop-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compute version metadata
        id: ver
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,8)
          $version = "0.1.0-webpreview.$env:GITHUB_RUN_NUMBER"
          [xml]$proj = Get-Content 'desktop/BonoWebDesktop/BonoWebDesktop.csproj'
          $sdk = ($proj.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'Microsoft.Web.WebView2' }).Version
          if (-not $sdk) { throw 'Microsoft.Web.WebView2 package version not found' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          "webview2sdk=$sdk" >> $env:GITHUB_OUTPUT

      - name: Verify month-only hearing calendar source
        run: node scripts/test_web_desktop_hearings.js

      - name: Verify case document inquiry UI
        run: node scripts/test_web_desktop_case_ui.js

      - name: Isolated single-case UYAP lifecycle E2E
        run: node scripts/test_webview2_uyap_single_case_e2e.js

      - name: Verify web API URLs stay same-origin
        shell: pwsh
        run: |
          $files = Get-ChildItem 'web' -Recurse -File | Where-Object { $_.Extension -in '.js','.html' }
          $hits = $files | Select-String -Pattern 'https?://(127\.0\.0\.1|localhost):47831' -ErrorAction SilentlyContinue
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.Path ':' $_.LineNumber ':' $_.Line }
            throw 'Web UI contains absolute BONO Core URLs; relative /api paths are required for same-origin preview proxy.'
          }
          $api = Get-Content 'web/js/api.js' -Raw
          if (-not $api.Contains('fetch(path')) { throw 'Expected relative fetch(path) API transport missing.' }

      - name: Restore WebView2 project
        run: dotnet restore desktop/BonoWebDesktop/BonoWebDesktop.csproj -r win-x64

      - name: Restore headless integration smoke
        run: dotnet restore desktop/BonoWebDesktop.Smoke/BonoWebDesktop.Smoke.csproj

      - name: Test bundled UI origin and Core API proxy
        run: dotnet run --project desktop/BonoWebDesktop.Smoke/BonoWebDesktop.Smoke.csproj -c Release --no-restore -- web

      - name: Publish self-contained single-file preview
        shell: pwsh
        run: |
          dotnet publish desktop/BonoWebDesktop/BonoWebDesktop.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:DebugType=None -p:DebugSymbols=false `
            -p:Version="${{ steps.ver.outputs.version }}" `
            -p:InformationalVersion="${{ steps.ver.outputs.version }}+${{ steps.ver.outputs.short }}" `
            -o dist/package

      - name: Create versioned web source bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist/web-source' | Out-Null
          Copy-Item 'web/*' 'dist/web-source/' -Recurse -Force
          [ordered]@{
            product = 'BONO OS Web UI'
            commit = '${{ github.sha }}'
            shortCommit = '${{ steps.ver.outputs.short }}'
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json | Set-Content 'dist/web-source/__bono_web_version.json' -Encoding utf8
          Compress-Archive -Path 'dist/web-source/*' -DestinationPath 'dist/package/web-bundle.zip'

      - name: Verify single executable binary
        shell: pwsh
        run: |
          $exe = 'dist/package/BONO OS Web Desktop.exe'
          if (!(Test-Path $exe)) { throw 'Expected WebView2 EXE missing' }
          if (!(Test-Path 'dist/package/web-bundle.zip')) { throw 'Expected versioned web bundle missing' }
          $allExe = @(Get-ChildItem 'dist/package' -Recurse -File -Filter '*.exe')
          if ($allExe.Count -ne 1) { throw "Expected exactly one EXE binary, found $($allExe.Count)" }
          $dlls = @(Get-ChildItem 'dist/package' -Recurse -File -Filter '*.dll')
          if ($dlls.Count -ne 0) {
            $dlls | ForEach-Object { Write-Host $_.FullName }
            throw 'Publish left external DLLs; single-file preview is not self-contained as expected.'
          }

      - name: Create EXE and web integrity manifest
        shell: pwsh
        run: |
          $exe = 'dist/package/BONO OS Web Desktop.exe'
          $web = 'dist/package/web-bundle.zip'
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $webHash = (Get-FileHash $web -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            schemaVersion = 1
            product = 'BONO OS Web Desktop Preview'
            version = '${{ steps.ver.outputs.version }}'
            commit = '${{ github.sha }}'
            shortCommit = '${{ steps.ver.outputs.short }}'
            webCommit = '${{ github.sha }}'
            builtAtUtc = (Get-Date).ToUniversalTime().ToString('o')
            executable = 'BONO OS Web Desktop.exe'
            sha256 = $exeHash
            webBundle = 'web-bundle.zip'
            webSha256 = $webHash
            webView2Runtime = 'Evergreen required'
            webView2Sdk = '${{ steps.ver.outputs.webview2sdk }}'
            coreHealthUri = 'http://127.0.0.1:47831/health'
            previewOrigin = 'loopback ephemeral same-origin proxy'
            channel = 'preview'
          } | ConvertTo-Json | Set-Content 'dist/package/release-manifest.json' -Encoding utf8
          @(
            "$exeHash  BONO OS Web Desktop.exe",
            "$webHash  web-bundle.zip"
          ) | Set-Content 'dist/package/SHA256SUMS.txt' -Encoding ascii

      - name: Verify package through updater
        shell: pwsh
        run: |
          ./scripts/web_desktop_updater.ps1 -Mode Plan -PackagePath 'dist/package' -RootPath (Join-Path $env:RUNNER_TEMP 'bono-web-plan') -SkipCoreProbe | Format-List

      - name: WebView2 updater regression tests
        shell: pwsh
        run: ./scripts/test_web_desktop_updater.ps1

      - name: Core and WebView2 runtime source smoke
        shell: pwsh
        run: |
          $source = Get-Content 'desktop/BonoWebDesktop/MainWindow.xaml.cs' -Raw
          if (-not $source.Contains('new Uri(CoreUri, "health")')) { throw 'Core /health preflight missing' }
          if (-not $source.Contains('CoreWebView2Environment.GetAvailableBrowserVersionString()')) { throw 'WebView2 Runtime detection missing' }
          if (-not $source.Contains('WebView2RuntimeNotFoundException')) { throw 'WebView2 Runtime missing-state handling missing' }
          if (-not $source.Contains('WebBundleManager.Prepare')) { throw 'Versioned web bundle loader missing' }
          if (-not $source.Contains('LocalPreviewServer.StartAsync')) { throw 'Same-origin local preview server missing' }
          if ($source.Contains('Browser.Source = CoreUri')) { throw 'Browser still navigates directly to live Core UI' }
          if ($source.Contains('Process.Start') -or $source.Contains('Process.Kill')) { throw 'Desktop preview must not start/stop Core processes' }

      - name: Package preview ZIP
        shell: pwsh
        run: |
          $name = "BONO-OS-WebView2-Preview-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short }}.zip"
          Compress-Archive -Path 'dist/package/*' -DestinationPath ("dist/" + $name)

      - uses: actions/upload-artifact@v4
        with:
          name: bono-os-webview2-preview-${{ steps.ver.outputs.version }}-${{ steps.ver.outputs.short }}
          path: |
            dist/package/BONO OS Web Desktop.exe
            dist/package/web-bundle.zip
            dist/package/release-manifest.json
            dist/package/SHA256SUMS.txt
            dist/BONO-OS-WebView2-Preview-*.zip
          retention-days: 14
