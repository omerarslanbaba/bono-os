<!doctype html><html lang="tr"><meta charset="utf-8"><title>BONO kontrollü gözlem</title>
<body><h1>Kontrollü gözlem</h1><p>Bu araç UYAP sorgusu veya indirme başlatmaz. Sekme kimliği dosya aidiyeti değildir.</p>
<label>BONO case ID <input id="case" type="number" min="1"></label>
<label>Frame ID <input id="frame" type="number" min="0" value="0"></label>
<p><label><input id="confirmed" type="checkbox">Aktif UYAP panelinin doğru dosya olduğunu görünür satır ve başlıktan doğruladım.</label></p>
<button id="start">Gözlemi başlat</button><button id="stop">Gözlemi bitir</button><pre id="status">Henüz başlatılmadı.</pre>
<script src="runtime_mode.js"></script><script src="observation_ui.js"></script></body></html>
